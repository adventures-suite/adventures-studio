name: Publish AdventuresCompanion TestFlight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: adventures-companion-testflight
  cancel-in-progress: false

env:
  DOTNET_VERSION: "10.0.x"
  PROJECT: src/AdventuresSuite.Companion.Mobile/AdventuresSuite.Companion.Mobile.csproj
  CLIENT_PROJECT: src/AdventuresSuite.Companion.Client/AdventuresSuite.Companion.Client.csproj
  TEST_PROJECT: tests/AdventuresSuite.Companion.Mobile.Tests/AdventuresSuite.Companion.Mobile.Tests.csproj
  TARGET_FRAMEWORK: net10.0-ios
  RUNTIME_IDENTIFIER: ios-arm64

jobs:
  publish-testflight:
    name: Build and upload iOS beta
    runs-on: macos-26
    timeout-minutes: 60
    environment: testflight

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate TestFlight configuration
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
          API_KEY_ID: ${{ vars.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ vars.APP_STORE_CONNECT_ISSUER_ID }}
          COMPANION_CONTENT_PROVIDER: ${{ vars.COMPANION_CONTENT_PROVIDER }}
          COMPANION_API_BASE_ADDRESS: ${{ vars.COMPANION_API_BASE_ADDRESS }}
          CERTIFICATE_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          API_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
        run: |
          missing=0
          for name in \
            APPLE_TEAM_ID \
            IOS_BUNDLE_ID \
            API_KEY_ID \
            API_ISSUER_ID \
            CERTIFICATE_BASE64 \
            CERTIFICATE_PASSWORD \
            PROFILE_BASE64 \
            API_PRIVATE_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not configured in the testflight GitHub Environment."
              missing=1
            fi
          done

          if [ "$COMPANION_CONTENT_PROVIDER" != "Demo" ] && [ "$COMPANION_CONTENT_PROVIDER" != "Api" ]; then
            echo "::error::COMPANION_CONTENT_PROVIDER must explicitly select Demo or Api."
            missing=1
          fi

          if [ "$COMPANION_CONTENT_PROVIDER" = "Api" ]; then
            if [[ ! "$COMPANION_API_BASE_ADDRESS" =~ ^https://[^/@]+([/:?#].*)?$ ]]; then
              echo "::error::COMPANION_API_BASE_ADDRESS must be a non-credentialed HTTPS origin for Api mode."
              missing=1
            fi
          fi

          if [ "$IOS_BUNDLE_ID" != "com.adventuresstudio.companion" ]; then
            echo "::error::IOS_BUNDLE_ID must be com.adventuresstudio.companion."
            missing=1
          fi

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Display Apple build environment
        run: |
          dotnet --info
          xcodebuild -version
          xcrun altool --version

      - name: Install .NET MAUI iOS workload
        run: dotnet workload install maui-ios

      - name: Test production Companion presentation
        run: >
          dotnet test
          "${{ env.TEST_PROJECT }}"
          --configuration Release
          --nologo
          --verbosity minimal

      - name: Install signing material
        id: signing
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
          CERTIFICATE_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail

          certificate_path="$RUNNER_TEMP/adventures-companion-distribution.p12"
          profile_path="$RUNNER_TEMP/adventures-companion.mobileprovision"
          profile_plist="$RUNNER_TEMP/adventures-companion-profile.plist"
          keychain_path="$RUNNER_TEMP/adventures-companion-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"

          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"
          printf '%s' "$PROFILE_BASE64" | base64 --decode > "$profile_path"
          chmod 600 "$certificate_path" "$profile_path"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"

          signing_identity="$(security find-identity -v -p codesigning "$keychain_path" \
            | sed -n 's/.*"\(Apple Distribution:.*\)"/\1/p' \
            | head -1)"
          if [ -z "$signing_identity" ]; then
            echo "::error::The imported certificate does not contain a valid Apple Distribution identity."
            exit 1
          fi

          security cms -D -i "$profile_path" > "$profile_plist"
          profile_uuid="$(plutil -extract UUID raw -o - "$profile_plist")"
          profile_name="$(plutil -extract Name raw -o - "$profile_plist")"
          profile_team="$(plutil -extract TeamIdentifier.0 raw -o - "$profile_plist")"
          profile_application_id="$(plutil -extract Entitlements.application-identifier raw -o - "$profile_plist")"

          if [ "$profile_team" != "$APPLE_TEAM_ID" ]; then
            echo "::error::The provisioning profile belongs to a different Apple team."
            exit 1
          fi

          if [ "$profile_application_id" != "$APPLE_TEAM_ID.$IOS_BUNDLE_ID" ]; then
            echo "::error::The provisioning profile does not match IOS_BUNDLE_ID."
            exit 1
          fi

          legacy_profiles="$HOME/Library/MobileDevice/Provisioning Profiles"
          xcode_profiles="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          mkdir -p "$legacy_profiles" "$xcode_profiles"
          cp "$profile_path" "$legacy_profiles/$profile_uuid.mobileprovision"
          cp "$profile_path" "$xcode_profiles/$profile_uuid.mobileprovision"

          {
            echo "SIGNING_IDENTITY=$signing_identity"
            echo "PROFILE_UUID=$profile_uuid"
            echo "PROFILE_NAME=$profile_name"
            echo "PROFILE_LEGACY_PATH=$legacy_profiles/$profile_uuid.mobileprovision"
            echo "PROFILE_XCODE_PATH=$xcode_profiles/$profile_uuid.mobileprovision"
            echo "SIGNING_KEYCHAIN_PATH=$keychain_path"
            echo "SIGNING_CERTIFICATE_PATH=$certificate_path"
            echo "SIGNING_PROFILE_SOURCE_PATH=$profile_path"
            echo "SIGNING_PROFILE_PLIST_PATH=$profile_plist"
          } >> "$GITHUB_ENV"

          echo "Provisioning profile: $profile_name"
          echo "Provisioning UUID: $profile_uuid"
          echo "Signing identity installed successfully."

      - name: Restore iOS project
        run: >
          dotnet restore
          "${{ env.PROJECT }}"
          --runtime "${{ env.RUNTIME_IDENTIFIER }}"
          -p:TargetFramework="${{ env.TARGET_FRAMEWORK }}"

      - name: Restore production Companion dependencies
        run: >
          dotnet restore
          "${{ env.CLIENT_PROJECT }}"

      - name: Build signed IPA
        env:
          IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
          COMPANION_CONTENT_PROVIDER: ${{ vars.COMPANION_CONTENT_PROVIDER }}
          COMPANION_API_BASE_ADDRESS: ${{ vars.COMPANION_API_BASE_ADDRESS }}
        run: >
          dotnet publish
          "${{ env.PROJECT }}"
          --framework "${{ env.TARGET_FRAMEWORK }}"
          --configuration Release
          --runtime "${{ env.RUNTIME_IDENTIFIER }}"
          --no-restore
          -p:ArchiveOnBuild=true
          -p:BuildIpa=true
          -p:ApplicationId="$IOS_BUNDLE_ID"
          -p:ApplicationVersion="${{ github.run_number }}"
          -p:CompanionContentProvider="$COMPANION_CONTENT_PROVIDER"
          -p:CompanionApiBaseAddress="$COMPANION_API_BASE_ADDRESS"
          -p:CodesignKey="$SIGNING_IDENTITY"
          -p:CodesignProvision="$PROFILE_UUID"

      - name: Validate signed IPA
        id: ipa
        shell: bash
        env:
          IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
        run: |
          set -euo pipefail

          ipa_path="$(find "$(dirname "${{ env.PROJECT }}")/bin/Release/${{ env.TARGET_FRAMEWORK }}/${{ env.RUNTIME_IDENTIFIER }}" \
            -type f -name '*.ipa' -print -quit)"
          if [ -z "$ipa_path" ]; then
            echo "::error::The iOS build did not produce an IPA."
            exit 1
          fi

          validation_dir="$RUNNER_TEMP/ipa-validation"
          mkdir -p "$validation_dir"
          unzip -q "$ipa_path" -d "$validation_dir"
          app_path="$(find "$validation_dir/Payload" -maxdepth 1 -type d -name '*.app' -print -quit)"
          if [ -z "$app_path" ]; then
            echo "::error::The IPA does not contain an application bundle."
            exit 1
          fi

          reported_bundle_id="$(plutil -extract CFBundleIdentifier raw -o - "$app_path/Info.plist")"
          reported_build="$(plutil -extract CFBundleVersion raw -o - "$app_path/Info.plist")"
          if [ "$reported_bundle_id" != "$IOS_BUNDLE_ID" ]; then
            echo "::error::IPA bundle ID does not match IOS_BUNDLE_ID."
            exit 1
          fi

          if [ "$reported_build" != "${{ github.run_number }}" ]; then
            echo "::error::IPA build number does not match the GitHub run number."
            exit 1
          fi

          codesign --verify --deep --strict --verbose=2 "$app_path"
          echo "ipa_path=$ipa_path" >> "$GITHUB_OUTPUT"
          echo "Validated bundle $reported_bundle_id build $reported_build."

      - name: Retain signed IPA
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: adventures-companion-testflight-${{ github.sha }}-${{ github.run_number }}
          path: ${{ steps.ipa.outputs.ipa_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Install App Store Connect API key
        shell: bash
        env:
          API_KEY_ID: ${{ vars.APP_STORE_CONNECT_API_KEY_ID }}
          API_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          api_key_directory="$HOME/.appstoreconnect/private_keys"
          api_key_path="$api_key_directory/AuthKey_$API_KEY_ID.p8"
          mkdir -p "$api_key_directory"
          printf '%s\n' "$API_PRIVATE_KEY" > "$api_key_path"
          chmod 600 "$api_key_path"
          echo "APP_STORE_CONNECT_API_KEY_PATH=$api_key_path" >> "$GITHUB_ENV"

      - name: Upload IPA to App Store Connect
        env:
          API_KEY_ID: ${{ vars.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ vars.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcrun altool \
            --upload-app \
            --type ios \
            --file "${{ steps.ipa.outputs.ipa_path }}" \
            --apiKey "$API_KEY_ID" \
            --apiIssuer "$API_ISSUER_ID"

      - name: Cleanup signing material
        if: always()
        shell: bash
        run: |
          if [ -n "${SIGNING_KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "$SIGNING_KEYCHAIN_PATH" || true
          fi
          rm -f \
            "${SIGNING_CERTIFICATE_PATH:-}" \
            "${SIGNING_PROFILE_SOURCE_PATH:-}" \
            "${SIGNING_PROFILE_PLIST_PATH:-}" \
            "${PROFILE_LEGACY_PATH:-}" \
            "${PROFILE_XCODE_PATH:-}" \
            "${APP_STORE_CONNECT_API_KEY_PATH:-}"
