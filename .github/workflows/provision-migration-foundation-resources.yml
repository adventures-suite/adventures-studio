name: Provision Migration Foundation Resources

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Explicit reviewed operation
        required: true
        default: proof
        type: choice
        options:
          - proof
          - deploy-foundation
      release_sha:
        description: Exact approved 40-character commit SHA
        required: true
        type: string
      approval_id:
        description: Sanitized identifier for the explicit federation-proof approval
        required: true
        type: string
      template_sha256:
        description: Exact approved foundation-resources.bicep SHA-256; required only for deployment
        required: false
        type: string
      parameters_sha256:
        description: Exact approved foundation-resources.dev.bicepparam SHA-256; required only for deployment
        required: false
        type: string
      identity_catalog_sha256:
        description: Exact approved trusted foundation identity catalog SHA-256
        required: false
        type: string
      assignment_timestamp_utc:
        description: Exact UTC timestamp when foundation authority was assigned
        required: false
        type: string
      authority_deadline_utc:
        description: Absolute UTC deadline no more than 30 minutes after assignment
        required: false
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  verify-federation:
    runs-on: ubuntu-24.04
    environment: migration-foundation-deployment
    timeout-minutes: 30
    env:
      AZURE_CLIENT_ID: ${{ vars.MIGRATION_FOUNDATION_DEPLOYER_CLIENT_ID }}
      EXPECTED_PRINCIPAL_ID: ${{ vars.MIGRATION_FOUNDATION_DEPLOYER_PRINCIPAL_ID }}
      APPROVED_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      APPROVED_TENANT_ID: ${{ vars.WORKFORCE_TENANT_ID }}
      TARGET_RESOURCE_GROUP: ${{ vars.MIGRATION_RESOURCE_GROUP }}
      PROOF_ENVIRONMENT: migration-foundation-deployment
    steps:
      - name: Validate approval inputs and configured identity
        id: inputs
        continue-on-error: true
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          APPROVAL_ID: ${{ inputs.approval_id }}
          OPERATION: ${{ inputs.operation }}
          TEMPLATE_SHA256: ${{ inputs.template_sha256 }}
          PARAMETERS_SHA256: ${{ inputs.parameters_sha256 }}
          IDENTITY_CATALOG_SHA256: ${{ inputs.identity_catalog_sha256 }}
          ASSIGNMENT_TIMESTAMP_UTC: ${{ inputs.assignment_timestamp_utc }}
          AUTHORITY_DEADLINE_UTC: ${{ inputs.authority_deadline_utc }}
          WORKFLOW_REF: ${{ github.ref }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          evidence_path="$RUNNER_TEMP/migration-federation-proof.state"
          printf 'PROOF_STATE_FILE=%s\n' "$evidence_path" >> "$GITHUB_ENV"
          printf 'stage=input_validation\n' > "$evidence_path"
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$WORKFLOW_REF" = 'refs/heads/main'
          test "$WORKFLOW_SHA" = "$RELEASE_SHA"
          [[ "$APPROVAL_ID" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{7,127}$ ]]
          [[ "$OPERATION" = 'proof' || "$OPERATION" = 'deploy-foundation' ]]
          if [[ "$OPERATION" = 'deploy-foundation' ]]; then
            [[ "$APPROVAL_ID" == foundation-deploy-* ]]
            [[ "$TEMPLATE_SHA256" =~ ^[0-9a-f]{64}$ ]]
            [[ "$PARAMETERS_SHA256" =~ ^[0-9a-f]{64}$ ]]
            [[ "$IDENTITY_CATALOG_SHA256" =~ ^[0-9a-f]{64}$ ]]
          else
            test -z "$TEMPLATE_SHA256"
            test -z "$PARAMETERS_SHA256"
            test -z "$IDENTITY_CATALOG_SHA256"
            test -z "$ASSIGNMENT_TIMESTAMP_UTC" && test -z "$AUTHORITY_DEADLINE_UTC"
          fi
          [[ "$AZURE_CLIENT_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]
          [[ "$EXPECTED_PRINCIPAL_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]
          [[ "$APPROVED_SUBSCRIPTION_ID" = '5ace9cdd-06d1-47d9-8214-1e7c756d076a' ]]
          [[ "$APPROVED_TENANT_ID" = 'd7add2bb-ac03-49a8-9377-d0bf6a012f2f' ]]
          [[ "$TARGET_RESOURCE_GROUP" = 'rg-adventures-suite-dev' ]]
          [[ "$AZURE_CLIENT_ID" = '223af00d-69e5-4302-9ac5-6b338f3ea2e5' ]]
          [[ "$EXPECTED_PRINCIPAL_ID" = 'b77b6201-ad26-4f77-8f88-6d0d43f7dbb8' ]]

      - name: Mark checkout integrity stage
        if: steps.inputs.outcome == 'success'
        run: printf 'stage=checkout_integrity\n' > "$PROOF_STATE_FILE"

      - name: Checkout exact approved SHA
        id: checkout
        if: steps.inputs.outcome == 'success'
        continue-on-error: true
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.release_sha }}
          persist-credentials: false

      - name: Prove checked-out commit
        id: integrity
        if: steps.checkout.outcome == 'success'
        continue-on-error: true
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: test "$(git rev-parse HEAD)" = "$RELEASE_SHA"

      - name: Mark OIDC authentication stage
        if: steps.integrity.outcome == 'success'
        run: printf 'stage=oidc_authentication\n' > "$PROOF_STATE_FILE"

      - name: Authenticate foundation deployer with Azure OIDC
        id: oidc
        if: steps.integrity.outcome == 'success'
        continue-on-error: true
        uses: azure/login@8216e11d8cd9b42fe925c852af8e76311ff067ac # v2
        with:
          client-id: ${{ vars.MIGRATION_FOUNDATION_DEPLOYER_CLIENT_ID }}
          tenant-id: ${{ vars.WORKFORCE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Verify ARM token identity and prove zero Azure access
        id: proof
        if: steps.oidc.outcome == 'success' && inputs.operation == 'proof'
        continue-on-error: true
        run: .github/scripts/run-deployer-federation-proof.sh "$PROOF_ENVIRONMENT" "${RUNNER_TEMP}/foundation" "$PROOF_STATE_FILE"

      - name: Verify deployment identity without probing SQL or mutating Azure
        id: deployment_identity
        if: steps.oidc.outcome == 'success' && inputs.operation == 'deploy-foundation'
        continue-on-error: true
        run: .github/scripts/run-deployer-federation-proof.sh "$PROOF_ENVIRONMENT" "${RUNNER_TEMP}/foundation" "$PROOF_STATE_FILE" identity-only

      - name: Validate, preview, deploy, and observe exact foundation
        id: deployment
        if: steps.deployment_identity.outcome == 'success' && inputs.operation == 'deploy-foundation'
        continue-on-error: true
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          APPROVAL_ID: ${{ inputs.approval_id }}
          TEMPLATE_SHA256: ${{ inputs.template_sha256 }}
          PARAMETERS_SHA256: ${{ inputs.parameters_sha256 }}
          IDENTITY_CATALOG_SHA256: ${{ inputs.identity_catalog_sha256 }}
          ASSIGNMENT_TIMESTAMP_UTC: ${{ inputs.assignment_timestamp_utc }}
          AUTHORITY_DEADLINE_UTC: ${{ inputs.authority_deadline_utc }}
        run: |
          evidence_path="$RUNNER_TEMP/foundation-deployment-evidence.json"
          printf 'FOUNDATION_EVIDENCE_FILE=%s\n' "$evidence_path" >> "$GITHUB_ENV"
          .github/scripts/run-foundation-deployment.sh \
            "$RELEASE_SHA" "$APPROVAL_ID" "$TEMPLATE_SHA256" "$PARAMETERS_SHA256" \
            "$PROOF_STATE_FILE" "$evidence_path" "$RUNNER_TEMP/foundation-deployment" \
            "$IDENTITY_CATALOG_SHA256" "$ASSIGNMENT_TIMESTAMP_UTC" "$AUTHORITY_DEADLINE_UTC"

      - name: Emit exactly one sanitized proof envelope
        if: always()
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          APPROVAL_ID: ${{ inputs.approval_id }}
          INPUT_OUTCOME: ${{ steps.inputs.outcome }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          INTEGRITY_OUTCOME: ${{ steps.integrity.outcome }}
          OIDC_OUTCOME: ${{ steps.oidc.outcome }}
          PROOF_OUTCOME: ${{ steps.proof.outcome }}
          OPERATION: ${{ inputs.operation }}
          DEPLOYMENT_IDENTITY_OUTCOME: ${{ steps.deployment_identity.outcome }}
          DEPLOYMENT_OUTCOME: ${{ steps.deployment.outcome }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re

          stage = 'complete'
          classification = 'complete'
          azure_error_code = None
          exit_code = 0
          outcomes = {
              'input_validation': os.environ.get('INPUT_OUTCOME'),
              'checkout_integrity': os.environ.get('CHECKOUT_OUTCOME'),
              'checkout_integrity_check': os.environ.get('INTEGRITY_OUTCOME'),
              'oidc_authentication': os.environ.get('OIDC_OUTCOME'),
              'proof': os.environ.get('PROOF_OUTCOME'),
          }
          if outcomes['input_validation'] != 'success':
              stage, classification, exit_code = 'input_validation', 'input_validation_failed', 1
          elif outcomes['checkout_integrity'] != 'success' or outcomes['checkout_integrity_check'] != 'success':
              stage, classification, exit_code = 'checkout_integrity', 'checkout_integrity_failed', 1
          elif outcomes['oidc_authentication'] != 'success':
              stage, classification, exit_code = 'oidc_authentication', 'oidc_authentication_failed', 1
          elif os.environ.get('OPERATION') == 'proof' and outcomes['proof'] != 'success':
              stage, classification, exit_code = 'arm_token_acquisition', 'operation_failed', 1
              try:
                  state = dict(
                      line.split('=', 1)
                      for line in open(os.environ['PROOF_STATE_FILE'], encoding='utf-8').read().splitlines()
                      if '=' in line
                  )
                  allowed_stages = {
                      'arm_token_acquisition',
                      'arm_token_claim_validation',
                      'resource_read_probe',
                      'resource_read_denial_classification',
                      'deployment_validation_probe',
                      'deployment_validation_denial_classification',
                  }
                  allowed_classifications = {
                      'operation_failed',
                      'claim_mismatch_tid',
                      'claim_mismatch_oid',
                      'claim_mismatch_client_id',
                      'claim_mismatch_aud',
                      'malformed_token',
                      'authorization_failed',
                      'unexpected_success',
                      'authentication_failed',
                      'subscription_resolution_failed',
                      'resource_not_found',
                      'throttled',
                      'network_failed',
                      'request_timeout',
                      'conflict',
                      'server_error',
                      'malformed_json',
                      'missing_error_code',
                      'transport_timeout',
                      'redirect',
                      'oversized_response',
                      'unexpected_http_status',
                      'unexpected_error_code',
                      'malformed_or_ambiguous',
                  }
                  candidate_exit = int(state.get('exit_code', '1'))
                  if state.get('stage') in allowed_stages:
                      stage = state['stage']
                  if state.get('classification') in allowed_classifications:
                      classification = state['classification']
                  candidate_code = state.get('azure_error_code', '')
                  allowed_codes = {'AuthorizationFailed', 'InvalidTemplate', 'InvalidTemplateDeployment', 'DeploymentFailed'}
                  expected_codes = {'azure_authorization_failed': {'AuthorizationFailed'}, 'azure_template_validation_failed': {'InvalidTemplate', 'InvalidTemplateDeployment'}, 'azure_deployment_failed': {'DeploymentFailed'}}
                  azure_error_code = candidate_code if candidate_code in allowed_codes else None
                  if classification in expected_codes and azure_error_code not in expected_codes[classification]:
                      classification, azure_error_code = 'malformed_evidence', None
                  if classification not in expected_codes:
                      azure_error_code = None
                  exit_code = candidate_exit if 1 <= candidate_exit <= 255 else 1
              except Exception:
                  stage, classification, exit_code = 'arm_token_acquisition', 'malformed_or_ambiguous', 1
          elif os.environ.get('OPERATION') == 'deploy-foundation' and os.environ.get('DEPLOYMENT_IDENTITY_OUTCOME') != 'success':
              stage, classification, exit_code = 'arm_token_claim_validation', 'deployment_identity_failed', 1
          elif os.environ.get('OPERATION') == 'deploy-foundation' and os.environ.get('DEPLOYMENT_OUTCOME') != 'success':
              stage, classification, exit_code = 'deployment', 'deployment_failed', 1
              try:
                  state = dict(
                      line.split('=', 1)
                      for line in open(os.environ['PROOF_STATE_FILE'], encoding='utf-8').read().splitlines()
                      if '=' in line
                  )
                  allowed_stages = {'artifact_validation', 'read_only_preflight', 'bicep_build', 'deployment_validation', 'what_if', 'deployment', 'deployment_readback'}
                  allowed_classifications = {
                      'operation_failed', 'what_if_approved', 'deployment_failed', 'oversized_evidence',
                      'azure_authorization_failed', 'azure_template_validation_failed', 'azure_deployment_failed', 'azure_error_unclassified',
                      'malformed_evidence', 'malformed_what_if', 'forbidden_what_if_content',
                      'unexpected_what_if_resource', 'unexpected_what_if_type', 'unexpected_what_if_operation',
                      'duplicate_what_if_resource', 'missing_what_if_resource', 'deployment_not_succeeded',
                      'malformed_deployment_outputs', 'unexpected_deployment_outputs',
                      'forbidden_deployment_output', 'deployment_output_identity_mismatch', 'malformed_identity_catalog',
                      'identity_catalog_mismatch', 'invalid_authority_window', 'authority_window_expired',
                  }
                  candidate_exit = int(state.get('exit_code', '1'))
                  if state.get('stage') in allowed_stages:
                      stage = state['stage']
                  if state.get('classification') in allowed_classifications:
                      classification = state['classification']
                  candidate_code = state.get('azure_error_code', '')
                  allowed_codes = {'AuthorizationFailed', 'InvalidTemplate', 'InvalidTemplateDeployment', 'DeploymentFailed'}
                  expected_codes = {'azure_authorization_failed': {'AuthorizationFailed'}, 'azure_template_validation_failed': {'InvalidTemplate', 'InvalidTemplateDeployment'}, 'azure_deployment_failed': {'DeploymentFailed'}}
                  azure_error_code = candidate_code if candidate_code in allowed_codes else None
                  if classification in expected_codes and azure_error_code not in expected_codes[classification]:
                      classification, azure_error_code = 'malformed_evidence', None
                  if classification not in expected_codes:
                      azure_error_code = None
                  exit_code = candidate_exit if 1 <= candidate_exit <= 255 else 1
              except Exception:
                  stage, classification, exit_code = 'deployment', 'malformed_evidence', 1

          approval_id = os.environ.get('APPROVAL_ID', '')
          release_sha = os.environ.get('RELEASE_SHA', '')
          if not re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9._-]{7,127}', approval_id):
              approval_id = '<invalid>'
          if not re.fullmatch(r'[0-9a-f]{40}', release_sha):
              release_sha = '<invalid>'
          envelope = {
              'eventName': 'migration-deployer-federation-proof' if os.environ.get('OPERATION') == 'proof' else 'migration-foundation-deployment',
              'approvalId': approval_id,
              'releaseSha': release_sha,
              'environment': os.environ['PROOF_ENVIRONMENT'],
              'stage': stage,
              'classification': classification,
              'exitCode': exit_code,
              'externalOwnerCleanupRequired': os.environ.get('OPERATION') == 'deploy-foundation',
          }
          if os.environ.get('OPERATION') == 'deploy-foundation':
              envelope['azureErrorCode'] = azure_error_code
              envelope['assignmentTimestampUtc'] = '${{ inputs.assignment_timestamp_utc }}'
              envelope['authorityDeadlineUtc'] = '${{ inputs.authority_deadline_utc }}'
          if os.environ.get('OPERATION') == 'deploy-foundation' and exit_code == 0:
              try:
                  evidence = json.load(open(os.environ['FOUNDATION_EVIDENCE_FILE'], encoding='utf-8'))
                  allowed = {'classification', 'provisioningState', 'registryResourceId', 'registryLoginServer', 'logWorkspaceResourceId', 'environmentResourceId', 'migrationIdentityResourceId', 'migrationIdentityPrincipalId', 'migrationIdentityClientId', 'pullIdentityResourceId', 'publisherIdentityResourceId', 'starterIdentityResourceId'}
                  if set(evidence) != allowed or evidence.get('classification') != 'deployment_complete':
                      raise ValueError()
                  envelope['outputs'] = evidence
              except Exception:
                  envelope['stage'] = 'deployment_readback'
                  envelope['classification'] = 'malformed_evidence'
                  envelope['exitCode'] = 1
                  exit_code = 1
          print(json.dumps(envelope, separators=(',', ':')))
          raise SystemExit(exit_code)
          PY

      - name: Remove temporary workflow evidence
        if: always()
        run: rm -f "${PROOF_STATE_FILE:-}" "${FOUNDATION_EVIDENCE_FILE:-}"
