name: Deploy AdventuresSuite Dev

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: adventures-suite-dev-deployment
  cancel-in-progress: false

env:
  DOTNET_VERSION: "10.0.303"
  PROJECT: src/TheSimontonAdventures.Web/TheSimontonAdventures.Web.csproj
  PUBLISH_DIR: ./artifacts/publish
  PACKAGE_DIR: ./artifacts/package
  PACKAGE_NAME: adventures-suite-${{ github.sha }}-${{ github.run_attempt }}.zip
  RUNTIME: linux-x64

jobs:
  build-and-deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: |
          dotnet restore TheSimontonAdventures.slnx
          dotnet restore "${{ env.PROJECT }}" --runtime "${{ env.RUNTIME }}"

      - name: Build
        run: >
          dotnet build
          TheSimontonAdventures.slnx
          --configuration Release
          --no-restore

      - name: Test
        run: >
          dotnet test
          TheSimontonAdventures.slnx
          --configuration Release
          --no-build

      - name: Publish
        run: >
          dotnet publish
          "${{ env.PROJECT }}"
          --configuration Release
          --no-restore
          --runtime "${{ env.RUNTIME }}"
          --self-contained true
          -p:SourceRevisionId="${{ github.sha }}"
          --output "${{ env.PUBLISH_DIR }}"

      - name: Create immutable deployment package
        run: |
          mkdir -p "${{ env.PACKAGE_DIR }}"
          cd "${{ env.PUBLISH_DIR }}"
          zip -q -r "$GITHUB_WORKSPACE/${{ env.PACKAGE_DIR }}/${{ env.PACKAGE_NAME }}" .

      - name: Retain deployment package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: adventures-suite-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ env.PACKAGE_DIR }}/${{ env.PACKAGE_NAME }}
          if-no-files-found: error
          retention-days: 14

      - name: Azure Login
        uses: azure/login@8216e11d8cd9b42fe925c852af8e76311ff067ac # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Configure application
        env:
          AZURE_DEFAULT_CREATOR_ID: ${{ vars.AZURE_DEFAULT_CREATOR_ID }}
          AUTHENTICATION_MODE: ${{ vars.AUTHENTICATION_MODE }}
        run: |
          if [ -z "$AZURE_DEFAULT_CREATOR_ID" ]; then
            echo "::error::Set AZURE_DEFAULT_CREATOR_ID in the GitHub dev environment."
            exit 1
          fi

          if [ "$AUTHENTICATION_MODE" != "Disabled" ] && [ "$AUTHENTICATION_MODE" != "ExternalProvider" ]; then
            echo "::error::Set AUTHENTICATION_MODE in the GitHub dev environment to Disabled or ExternalProvider."
            exit 1
          fi

          az webapp config appsettings set \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_WEBAPP_NAME }}" \
            --settings \
              CreatorResolution__AzureDefaultCreatorId="$AZURE_DEFAULT_CREATOR_ID" \
              Authentication__Mode="$AUTHENTICATION_MODE" \
              Deployment__Environment=Development \
              PlannerCatalog__Mode=DevelopmentPreview \
              Authentication__TrustedProxyNetworks__0="169.254.0.0/16" \
              Authentication__TrustedProxyNetworks__1="10.0.0.0/8" \
              Authentication__TrustedProxyNetworks__2="172.16.0.0/12" \
              Authentication__TrustedProxyNetworks__3="192.168.0.0/16" \
              Deployment__CommitSha="${{ github.sha }}" \
              Deployment__RunId="${{ github.run_id }}" \
              Deployment__RunAttempt="${{ github.run_attempt }}" \
              WEBSITE_HEALTHCHECK_MAXPINGFAILURES=3 \
              WEBSITES_CONTAINER_START_TIME_LIMIT=600 \
              WEBSITE_RUN_FROM_PACKAGE=1 \
            --output none

          az webapp config set \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_WEBAPP_NAME }}" \
            --startup-file "./TheSimontonAdventures.Web" \
            --generic-configurations '{"healthCheckPath":"/health"}' \
            --output none

          CONFIGURED_HEALTH_PATH="$(az webapp config show \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_WEBAPP_NAME }}" \
            --query healthCheckPath \
            --output tsv)"

          if [ "$CONFIGURED_HEALTH_PATH" != "/health" ]; then
            echo "::error::App Service Health Check is not configured for /health."
            exit 1
          fi

      - name: Deploy Web App
        run: |
          echo "DEPLOYMENT_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          PREVIOUS_DEPLOYMENT_RECORD_ID="$(az webapp log deployment list \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_WEBAPP_NAME }}" \
            --query '[0].id' \
            --output tsv)"

          for attempt in 1 2 3; do
            if az webapp deploy \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --name "${{ vars.AZURE_WEBAPP_NAME }}" \
              --src-path "${{ env.PACKAGE_DIR }}/${{ env.PACKAGE_NAME }}" \
              --type zip \
              --async false \
              --clean true \
              --restart false \
              --track-status false \
              --enriched-errors true \
              --output none; then
              break
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "::error::Azure package deployment failed after 3 attempts."
              exit 1
            fi

            retry_delay=$((attempt * 20))
            echo "::warning::Azure package deployment attempt $attempt failed; retrying the same package in $retry_delay seconds."
            sleep "$retry_delay"
          done

          PACKAGE_UPLOAD_COMPLETED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "PACKAGE_UPLOAD_COMPLETED_AT=$PACKAGE_UPLOAD_COMPLETED_AT" >> "$GITHUB_ENV"

          DEPLOYMENT_RECORD=""
          for attempt in {1..12}; do
            DEPLOYMENT_RECORD="$(az webapp log deployment list \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --name "${{ vars.AZURE_WEBAPP_NAME }}" \
              --query '[0]' \
              --output json)"

            if ! jq -e \
              'type == "object" and
               (.id | type == "string") and
               (.status | type == "number") and
               (.complete | type == "boolean")' \
              >/dev/null <<<"$DEPLOYMENT_RECORD"; then
              echo "::error::Azure returned a malformed deployment record."
              exit 1
            fi

            if jq -e --arg previous "$PREVIOUS_DEPLOYMENT_RECORD_ID" \
              '.status == 4 and
               .complete == true and
               .end_time != null and
               (.id | tostring) != $previous' \
              >/dev/null <<<"$DEPLOYMENT_RECORD"; then
              break
            fi

            if [ "$attempt" -eq 12 ]; then
              DEPLOYMENT_RECORD=""
              break
            fi

            echo "Deployment record is not complete yet; retrying in 5 seconds."
            sleep 5
          done

          if [ -z "$DEPLOYMENT_RECORD" ]; then
            echo "::error::Azure did not report a completed package deployment before restart."
            exit 1
          fi

          echo "DEPLOYMENT_RECORD_ID=$(jq -r '.id' <<<"$DEPLOYMENT_RECORD")" >> "$GITHUB_ENV"

          az webapp restart \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_WEBAPP_NAME }}"

          echo "APPLICATION_RESTARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Verify deployment
        env:
          AZURE_DEFAULT_CREATOR_ID: ${{ vars.AZURE_DEFAULT_CREATOR_ID }}
        run: |
          APP_HOSTNAME="$(az webapp show \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_WEBAPP_NAME }}" \
            --query defaultHostName \
            --output tsv)"

          HEALTH_URL="https://$APP_HOSTNAME/health"

          for attempt in {1..18}; do
            if HEALTH_RESPONSE="$(curl --fail --show-error --silent "$HEALTH_URL")" && \
               jq -e --arg expected_sha "${{ github.sha }}" \
                 '.status == "Healthy" and
                  (.deploymentVersion |
                    capture("\\+(?<sha>[0-9a-f]{40})$").sha == $expected_sha) and
                  .resourcesValidated == true and
                  .creatorContentValidated == true' \
                 >/dev/null <<<"$HEALTH_RESPONSE"; then
              echo "Deployment is healthy and startup validation succeeded."

              WORKSPACE_URL="https://$APP_HOSTNAME/workspace/creators/$AZURE_DEFAULT_CREATOR_ID/plans"
              WORKSPACE_RESPONSE="$(curl --fail --show-error --silent "$WORKSPACE_URL")"
              if ! grep -Fq "Sign in to your workspace" <<<"$WORKSPACE_RESPONSE"; then
                echo "::error::The canonical workspace host did not render the anonymous private workspace entry point."
                exit 1
              fi

              SIGN_IN_STATUS="$(curl --silent --show-error --output /dev/null \
                --write-out '%{http_code}' \
                "https://$APP_HOSTNAME/authentication/sign-in")"
              if [ "$SIGN_IN_STATUS" != "302" ]; then
                echo "::error::The canonical workspace sign-in endpoint returned HTTP $SIGN_IN_STATUS instead of 302."
                exit 1
              fi

              echo "Canonical workspace and sign-in smoke tests succeeded."

              {
                echo "## Dev deployment"
                echo ""
                echo "- Commit: \`${{ github.sha }}\`"
                echo "- Package: \`${{ env.PACKAGE_NAME }}\`"
                echo "- Artifact: \`adventures-suite-${{ github.sha }}-${{ github.run_attempt }}\`"
                echo "- Started: \`$DEPLOYMENT_STARTED_AT\`"
                echo "- Upload completed: \`$PACKAGE_UPLOAD_COMPLETED_AT\`"
                echo "- Application restarted: \`$APPLICATION_RESTARTED_AT\`"
                echo "- Deployment record: \`$DEPLOYMENT_RECORD_ID\`"
                echo "- Health endpoint: \`$HEALTH_URL\`"
                echo "- Resource validation: passed"
                echo "- Creator content validation: passed"
                echo "- Canonical workspace classification: passed"
                echo "- External ID sign-in challenge: passed"
              } >> "$GITHUB_STEP_SUMMARY"

              exit 0
            fi

            echo "Health verification attempt $attempt of 18 failed; retrying in 10 seconds."
            sleep 10
          done

          echo "::error::Deployment did not become healthy after 3 minutes."
          exit 1

      - name: Capture deployment diagnostics
        if: failure()
        run: |
          APP_HOSTNAME="$(az webapp show \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_WEBAPP_NAME }}" \
            --query defaultHostName \
            --output tsv 2>/dev/null || true)"
          SCM_HOSTNAME="$(az webapp show \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_WEBAPP_NAME }}" \
            --query "enabledHostNames[?contains(@, '.scm.')]|[0]" \
            --output tsv 2>/dev/null || true)"
          HEALTH_RESPONSE=""

          if [ -n "$APP_HOSTNAME" ]; then
            HEALTH_RESPONSE="$(curl --silent --show-error --max-time 20 \
              "https://$APP_HOSTNAME/health" || true)"
          fi
          REPORTED_VERSION="$(jq -r '.deploymentVersion // "unavailable"' \
            <<<"$HEALTH_RESPONSE" 2>/dev/null || echo "unavailable")"
          REPORTED_SHA="${REPORTED_VERSION##*+}"
          HEALTH_STATUS="$(jq -r '.status // "unavailable"' \
            <<<"$HEALTH_RESPONSE" 2>/dev/null || echo "unavailable")"
          APP_STATE="$(az webapp show \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_WEBAPP_NAME }}" \
            --query state \
            --output tsv 2>/dev/null || echo "unavailable")"
          ACTIVE_PACKAGE="unavailable"
          KUDU_TOKEN="$(az account get-access-token \
            --resource https://management.azure.com/ \
            --query accessToken \
            --output tsv 2>/dev/null || true)"

          if [ -n "$KUDU_TOKEN" ] && [ -n "$SCM_HOSTNAME" ]; then
            SCM_RESPONSE="$(curl --silent --show-error --fail --max-time 20 \
              --header "Authorization: Bearer $KUDU_TOKEN" \
              "https://$SCM_HOSTNAME/api/vfs/data/SitePackages/packagename.txt" \
              2>/dev/null || echo "unavailable")"

            if [[ "$SCM_RESPONSE" =~ ^[A-Za-z0-9._-]{1,200}\.zip$ ]]; then
              ACTIVE_PACKAGE="$SCM_RESPONSE"
            fi
          fi

          echo "## Failed dev deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Expected SHA: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Reported SHA: \`$REPORTED_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Package: \`${{ env.PACKAGE_NAME }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Active package pointer: \`$ACTIVE_PACKAGE\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- App Service state: \`$APP_STATE\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Health status: \`$HEALTH_STATUS\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Workflow run: \`${{ github.run_id }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          az webapp log deployment list \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_WEBAPP_NAME }}" \
            --query '[0].{id:id,status:status,start:start_time,end:end_time}' \
            --output json >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
