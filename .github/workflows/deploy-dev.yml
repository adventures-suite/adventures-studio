name: Deploy AdventuresSuite Dev

on:
  push:
    branches:
      - feature/journey-engine

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  DOTNET_VERSION: "10.0.x"
  PROJECT: src/TheSimontonAdventures.Web/TheSimontonAdventures.Web.csproj
  PUBLISH_DIR: ./artifacts/publish
  PACKAGE_DIR: ./artifacts/package
  PACKAGE_NAME: adventures-suite-${{ github.sha }}-${{ github.run_attempt }}.zip
  RUNTIME: linux-x64

jobs:
  build-and-deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: |
          dotnet restore TheSimontonAdventures.slnx
          dotnet restore "${{ env.PROJECT }}" --runtime "${{ env.RUNTIME }}"

      - name: Build
        run: >
          dotnet build
          TheSimontonAdventures.slnx
          --configuration Release
          --no-restore

      - name: Test
        run: >
          dotnet test
          TheSimontonAdventures.slnx
          --configuration Release
          --no-build

      - name: Publish
        run: >
          dotnet publish
          "${{ env.PROJECT }}"
          --configuration Release
          --no-restore
          --runtime "${{ env.RUNTIME }}"
          --self-contained true
          --output "${{ env.PUBLISH_DIR }}"

      - name: Create immutable deployment package
        run: |
          mkdir -p "${{ env.PACKAGE_DIR }}"
          cd "${{ env.PUBLISH_DIR }}"
          zip -q -r "$GITHUB_WORKSPACE/${{ env.PACKAGE_DIR }}/${{ env.PACKAGE_NAME }}" .

      - name: Retain deployment package
        uses: actions/upload-artifact@v4
        with:
          name: adventures-suite-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ env.PACKAGE_DIR }}/${{ env.PACKAGE_NAME }}
          if-no-files-found: error
          retention-days: 14

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Configure application
        env:
          AZURE_DEFAULT_CREATOR_ID: ${{ vars.AZURE_DEFAULT_CREATOR_ID }}
        run: |
          if [ -z "$AZURE_DEFAULT_CREATOR_ID" ]; then
            echo "::error::Set AZURE_DEFAULT_CREATOR_ID in the GitHub dev environment."
            exit 1
          fi

          az webapp config appsettings set \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_WEBAPP_NAME }}" \
            --settings \
              CreatorResolution__AzureDefaultCreatorId="$AZURE_DEFAULT_CREATOR_ID" \
              WEBSITE_RUN_FROM_PACKAGE=1 \
            --output none

          az webapp config set \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_WEBAPP_NAME }}" \
            --startup-file "./TheSimontonAdventures.Web" \
            --output none

      - name: Deploy Web App
        run: |
          az webapp deploy \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_WEBAPP_NAME }}" \
            --src-path "${{ env.PACKAGE_DIR }}/${{ env.PACKAGE_NAME }}" \
            --type zip \
            --clean true \
            --restart true \
            --track-status true \
            --output none

      - name: Verify deployment
        run: |
          APP_HOSTNAME="$(az webapp show \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_WEBAPP_NAME }}" \
            --query defaultHostName \
            --output tsv)"

          HEALTH_URL="https://$APP_HOSTNAME/health"

          for attempt in {1..18}; do
            if HEALTH_RESPONSE="$(curl --fail --show-error --silent "$HEALTH_URL")" && \
               jq -e \
                 '.status == "Healthy" and
                  .resourcesValidated == true and
                  .creatorContentValidated == true' \
                 >/dev/null <<<"$HEALTH_RESPONSE"; then
              echo "Deployment is healthy and startup validation succeeded."
              exit 0
            fi

            echo "Health verification attempt $attempt of 18 failed; retrying in 10 seconds."
            sleep 10
          done

          echo "::error::Deployment did not become healthy after 3 minutes."
          exit 1
