name: Deploy AdventuresSuite Dev

on:
  push:
    branches:
      - feature/journey-engine

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  DOTNET_VERSION: "10.0.x"
  PROJECT: src/TheSimontonAdventures.Web/TheSimontonAdventures.Web.csproj
  PUBLISH_DIR: ./artifacts/publish

jobs:
  build-and-deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore TheSimontonAdventures.slnx

      - name: Build
        run: >
          dotnet build
          TheSimontonAdventures.slnx
          --configuration Release
          --no-restore

      - name: Test
        run: >
          dotnet test
          TheSimontonAdventures.slnx
          --configuration Release
          --no-build

      - name: Publish
        run: >
          dotnet publish
          "${{ env.PROJECT }}"
          --configuration Release
          --no-build
          --output "${{ env.PUBLISH_DIR }}"

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: ${{ env.PUBLISH_DIR }}
