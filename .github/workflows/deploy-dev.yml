name: Deploy AdventuresSuite Dev

on:
  push:
    branches:
      - feature/journey-engine

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  DOTNET_VERSION: "10.0.x"
  PROJECT: src/TheSimontonAdventures.Web/TheSimontonAdventures.Web.csproj
  PUBLISH_DIR: ./artifacts/publish
  RUNTIME: linux-x64

jobs:
  build-and-deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: |
          dotnet restore TheSimontonAdventures.slnx
          dotnet restore "${{ env.PROJECT }}" --runtime "${{ env.RUNTIME }}"

      - name: Build
        run: >
          dotnet build
          TheSimontonAdventures.slnx
          --configuration Release
          --no-restore

      - name: Test
        run: >
          dotnet test
          TheSimontonAdventures.slnx
          --configuration Release
          --no-build

      - name: Publish
        run: >
          dotnet publish
          "${{ env.PROJECT }}"
          --configuration Release
          --no-restore
          --runtime "${{ env.RUNTIME }}"
          --self-contained true
          --output "${{ env.PUBLISH_DIR }}"

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Configure application
        env:
          AZURE_DEFAULT_CREATOR_ID: ${{ vars.AZURE_DEFAULT_CREATOR_ID }}
        run: |
          if [ -z "$AZURE_DEFAULT_CREATOR_ID" ]; then
            echo "::error::Set AZURE_DEFAULT_CREATOR_ID in the GitHub dev environment."
            exit 1
          fi

          az webapp config appsettings set \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_WEBAPP_NAME }}" \
            --settings CreatorResolution__AzureDefaultCreatorId="$AZURE_DEFAULT_CREATOR_ID" \
            --output none

          az webapp config set \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_WEBAPP_NAME }}" \
            --startup-file "./TheSimontonAdventures.Web" \
            --output none

      - name: Deploy Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: ${{ env.PUBLISH_DIR }}

      - name: Verify deployment
        run: |
          APP_HOSTNAME="$(az webapp show \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_WEBAPP_NAME }}" \
            --query defaultHostName \
            --output tsv)"

          curl --fail --show-error --silent \
            --retry 12 \
            --retry-delay 10 \
            --retry-all-errors \
            "https://$APP_HOSTNAME/" \
            --output /dev/null
