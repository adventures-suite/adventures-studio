name: Prove Migration RBAC Deployer Federation

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact approved 40-character commit SHA
        required: true
        type: string
      approval_id:
        description: Sanitized identifier for the explicit federation-proof approval
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  verify-federation:
    runs-on: ubuntu-24.04
    environment: migration-rbac-deployment
    timeout-minutes: 10
    env:
      AZURE_CLIENT_ID: ${{ vars.MIGRATION_RBAC_DEPLOYER_CLIENT_ID }}
      EXPECTED_PRINCIPAL_ID: ${{ vars.MIGRATION_RBAC_DEPLOYER_PRINCIPAL_ID }}
      APPROVED_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      APPROVED_TENANT_ID: ${{ vars.WORKFORCE_TENANT_ID }}
      TARGET_RESOURCE_GROUP: ${{ vars.MIGRATION_RESOURCE_GROUP }}
      PROOF_ENVIRONMENT: migration-rbac-deployment
    steps:
      - name: Validate approval inputs and configured identity
        id: inputs
        continue-on-error: true
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          APPROVAL_ID: ${{ inputs.approval_id }}
          WORKFLOW_REF: ${{ github.ref }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          evidence_path="$RUNNER_TEMP/migration-federation-proof.state"
          printf 'PROOF_STATE_FILE=%s\n' "$evidence_path" >> "$GITHUB_ENV"
          printf 'stage=input_validation\n' > "$evidence_path"
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$WORKFLOW_REF" = 'refs/heads/main'
          test "$WORKFLOW_SHA" = "$RELEASE_SHA"
          [[ "$APPROVAL_ID" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{7,127}$ ]]
          [[ "$AZURE_CLIENT_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]
          [[ "$EXPECTED_PRINCIPAL_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]
          [[ "$APPROVED_SUBSCRIPTION_ID" = '5ace9cdd-06d1-47d9-8214-1e7c756d076a' ]]
          [[ "$APPROVED_TENANT_ID" = 'd7add2bb-ac03-49a8-9377-d0bf6a012f2f' ]]
          [[ "$TARGET_RESOURCE_GROUP" = 'rg-adventures-suite-dev' ]]
          [[ "$AZURE_CLIENT_ID" = 'd678e2ad-ada2-4cde-bb79-44630acf1cc8' ]]
          [[ "$EXPECTED_PRINCIPAL_ID" = '822c1c0c-39e1-400f-b9fc-9532a11bae5d' ]]

      - name: Mark checkout integrity stage
        if: steps.inputs.outcome == 'success'
        run: printf 'stage=checkout_integrity\n' > "$PROOF_STATE_FILE"

      - name: Checkout exact approved SHA
        id: checkout
        if: steps.inputs.outcome == 'success'
        continue-on-error: true
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.release_sha }}
          persist-credentials: false

      - name: Prove checked-out commit
        id: integrity
        if: steps.checkout.outcome == 'success'
        continue-on-error: true
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: test "$(git rev-parse HEAD)" = "$RELEASE_SHA"

      - name: Mark OIDC authentication stage
        if: steps.integrity.outcome == 'success'
        run: printf 'stage=oidc_authentication\n' > "$PROOF_STATE_FILE"

      - name: Authenticate RBAC deployer with Azure OIDC
        id: oidc
        if: steps.integrity.outcome == 'success'
        continue-on-error: true
        uses: azure/login@8216e11d8cd9b42fe925c852af8e76311ff067ac # v2
        with:
          client-id: ${{ vars.MIGRATION_RBAC_DEPLOYER_CLIENT_ID }}
          tenant-id: ${{ vars.WORKFORCE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Verify ARM token identity and prove zero Azure access
        id: proof
        if: steps.oidc.outcome == 'success'
        continue-on-error: true
        run: .github/scripts/run-deployer-federation-proof.sh "$PROOF_ENVIRONMENT" "${RUNNER_TEMP}/rbac" "$PROOF_STATE_FILE"

      - name: Emit exactly one sanitized proof envelope
        if: always()
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          APPROVAL_ID: ${{ inputs.approval_id }}
          INPUT_OUTCOME: ${{ steps.inputs.outcome }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          INTEGRITY_OUTCOME: ${{ steps.integrity.outcome }}
          OIDC_OUTCOME: ${{ steps.oidc.outcome }}
          PROOF_OUTCOME: ${{ steps.proof.outcome }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re

          stage = 'complete'
          classification = 'complete'
          exit_code = 0
          outcomes = {
              'input_validation': os.environ.get('INPUT_OUTCOME'),
              'checkout_integrity': os.environ.get('CHECKOUT_OUTCOME'),
              'checkout_integrity_check': os.environ.get('INTEGRITY_OUTCOME'),
              'oidc_authentication': os.environ.get('OIDC_OUTCOME'),
              'proof': os.environ.get('PROOF_OUTCOME'),
          }
          if outcomes['input_validation'] != 'success':
              stage, classification, exit_code = 'input_validation', 'input_validation_failed', 1
          elif outcomes['checkout_integrity'] != 'success' or outcomes['checkout_integrity_check'] != 'success':
              stage, classification, exit_code = 'checkout_integrity', 'checkout_integrity_failed', 1
          elif outcomes['oidc_authentication'] != 'success':
              stage, classification, exit_code = 'oidc_authentication', 'oidc_authentication_failed', 1
          elif outcomes['proof'] != 'success':
              stage, classification, exit_code = 'arm_token_acquisition', 'operation_failed', 1
              try:
                  state = dict(
                      line.split('=', 1)
                      for line in open(os.environ['PROOF_STATE_FILE'], encoding='utf-8').read().splitlines()
                      if '=' in line
                  )
                  allowed_stages = {
                      'arm_token_acquisition',
                      'arm_token_claim_validation',
                      'resource_read_probe',
                      'resource_read_denial_classification',
                      'deployment_validation_probe',
                      'deployment_validation_denial_classification',
                  }
                  allowed_classifications = {
                      'operation_failed',
                      'claim_mismatch_tid',
                      'claim_mismatch_oid',
                      'claim_mismatch_client_id',
                      'claim_mismatch_aud',
                      'malformed_token',
                      'authorization_failed',
                      'unexpected_success',
                      'authentication_failed',
                      'subscription_resolution_failed',
                      'resource_not_found',
                      'throttled',
                      'network_failed',
                      'malformed_or_ambiguous',
                  }
                  candidate_exit = int(state.get('exit_code', '1'))
                  if state.get('stage') in allowed_stages:
                      stage = state['stage']
                  if state.get('classification') in allowed_classifications:
                      classification = state['classification']
                  exit_code = candidate_exit if 1 <= candidate_exit <= 255 else 1
              except Exception:
                  stage, classification, exit_code = 'arm_token_acquisition', 'malformed_or_ambiguous', 1

          approval_id = os.environ.get('APPROVAL_ID', '')
          release_sha = os.environ.get('RELEASE_SHA', '')
          if not re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9._-]{7,127}', approval_id):
              approval_id = '<invalid>'
          if not re.fullmatch(r'[0-9a-f]{40}', release_sha):
              release_sha = '<invalid>'
          envelope = {
              'eventName': 'migration-deployer-federation-proof',
              'approvalId': approval_id,
              'releaseSha': release_sha,
              'environment': os.environ['PROOF_ENVIRONMENT'],
              'stage': stage,
              'classification': classification,
              'exitCode': exit_code,
          }
          print(json.dumps(envelope, separators=(',', ':')))
          raise SystemExit(exit_code)
          PY
