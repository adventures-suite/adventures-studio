name: Manage Migration Foundation RBAC Boundary

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Exact separately approved RBAC operation
        required: true
        type: choice
        options:
          - bootstrap-role-definitions
          - assign-foundation-access
          - remove-foundation-access
      release_sha:
        description: Exact approved protected-main SHA
        required: true
        type: string
      approval_id:
        description: Exact sanitized approval identifier
        required: true
        type: string
      template_sha256:
        description: Approved template SHA-256 when applicable
        required: false
        type: string
      parameters_sha256:
        description: Approved parameter SHA-256 when applicable
        required: false
        type: string
      catalog_sha256:
        description: Approved ordered role-catalog SHA-256 for bootstrap only
        required: false
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  manage-boundary:
    runs-on: ubuntu-24.04
    environment: migration-rbac-deployment
    timeout-minutes: 15
    env:
      AZURE_CLIENT_ID: ${{ vars.MIGRATION_RBAC_DEPLOYER_CLIENT_ID }}
      EXPECTED_PRINCIPAL_ID: ${{ vars.MIGRATION_RBAC_DEPLOYER_PRINCIPAL_ID }}
      APPROVED_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      APPROVED_TENANT_ID: ${{ vars.WORKFORCE_TENANT_ID }}
      TARGET_RESOURCE_GROUP: ${{ vars.MIGRATION_RESOURCE_GROUP }}
      PROOF_ENVIRONMENT: migration-rbac-deployment
    steps:
      - name: Validate exact approval and source inputs
        id: inputs
        continue-on-error: true
        env:
          OPERATION: ${{ inputs.operation }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          APPROVAL_ID: ${{ inputs.approval_id }}
          WORKFLOW_REF: ${{ github.ref }}
          WORKFLOW_SHA: ${{ github.sha }}
          TEMPLATE_SHA256: ${{ inputs.template_sha256 }}
          PARAMETERS_SHA256: ${{ inputs.parameters_sha256 }}
          CATALOG_SHA256: ${{ inputs.catalog_sha256 }}
        run: |
          state_file="$RUNNER_TEMP/migration-foundation-rbac.state"
          evidence_file="$RUNNER_TEMP/migration-foundation-rbac-evidence.json"
          printf 'RBAC_STATE_FILE=%s\nRBAC_EVIDENCE_FILE=%s\n' "$state_file" "$evidence_file" >> "$GITHUB_ENV"
          printf 'stage=input_validation\nclassification=operation_failed\nexit_code=1\n' >"$state_file"
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$WORKFLOW_REF" = 'refs/heads/main'
          test "$WORKFLOW_SHA" = "$RELEASE_SHA"
          [[ "$APPROVAL_ID" =~ ^(role-bootstrap|foundation-access-assign|foundation-access-remove)-[A-Za-z0-9._-]{8,96}$ ]]
          [[ "$AZURE_CLIENT_ID" = 'd678e2ad-ada2-4cde-bb79-44630acf1cc8' ]]
          [[ "$EXPECTED_PRINCIPAL_ID" = '822c1c0c-39e1-400f-b9fc-9532a11bae5d' ]]
          [[ "$APPROVED_SUBSCRIPTION_ID" = '5ace9cdd-06d1-47d9-8214-1e7c756d076a' ]]
          [[ "$APPROVED_TENANT_ID" = 'd7add2bb-ac03-49a8-9377-d0bf6a012f2f' ]]
          [[ "$TARGET_RESOURCE_GROUP" = 'rg-adventures-suite-dev' ]]
          case "$OPERATION" in
            bootstrap-role-definitions)
              [[ "$APPROVAL_ID" == role-bootstrap-* ]]
              [[ "$TEMPLATE_SHA256" =~ ^[0-9a-f]{64}$ ]]
              test -z "$PARAMETERS_SHA256"
              [[ "$CATALOG_SHA256" =~ ^[0-9a-f]{64}$ ]]
              ;;
            assign-foundation-access)
              [[ "$APPROVAL_ID" == foundation-access-assign-* ]]
              [[ "$TEMPLATE_SHA256" =~ ^[0-9a-f]{64}$ ]]
              [[ "$PARAMETERS_SHA256" =~ ^[0-9a-f]{64}$ ]]
              test -z "$CATALOG_SHA256"
              ;;
            remove-foundation-access)
              [[ "$APPROVAL_ID" == foundation-access-remove-* ]]
              test -z "$TEMPLATE_SHA256" && test -z "$PARAMETERS_SHA256" && test -z "$CATALOG_SHA256"
              ;;
            *) exit 2 ;;
          esac

      - name: Checkout exact approved SHA
        id: checkout
        if: steps.inputs.outcome == 'success'
        continue-on-error: true
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.release_sha }}
          persist-credentials: false

      - name: Prove checked-out commit
        id: integrity
        if: steps.checkout.outcome == 'success'
        continue-on-error: true
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: test "$(git rev-parse HEAD)" = "$RELEASE_SHA"

      - name: Authenticate exact RBAC bootstrap identity
        id: oidc
        if: steps.integrity.outcome == 'success'
        continue-on-error: true
        uses: azure/login@8216e11d8cd9b42fe925c852af8e76311ff067ac # v2
        with:
          client-id: ${{ vars.MIGRATION_RBAC_DEPLOYER_CLIENT_ID }}
          tenant-id: ${{ vars.WORKFORCE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Validate exact RBAC identity claims
        id: identity
        if: steps.oidc.outcome == 'success'
        continue-on-error: true
        run: .github/scripts/run-deployer-federation-proof.sh "$PROOF_ENVIRONMENT" "$RUNNER_TEMP/rbac-boundary" "$RBAC_STATE_FILE" identity-only

      - name: Run the separately approved RBAC operation
        id: operation
        if: steps.identity.outcome == 'success'
        continue-on-error: true
        env:
          OPERATION: ${{ inputs.operation }}
          TEMPLATE_SHA256: ${{ inputs.template_sha256 }}
          PARAMETERS_SHA256: ${{ inputs.parameters_sha256 }}
          CATALOG_SHA256: ${{ inputs.catalog_sha256 }}
        run: |
          .github/scripts/run-rbac-boundary-operation.sh "$OPERATION" "$TEMPLATE_SHA256" \
            "$PARAMETERS_SHA256" "$CATALOG_SHA256" "$RBAC_STATE_FILE" "$RBAC_EVIDENCE_FILE" \
            "$RUNNER_TEMP/rbac-boundary-operation"

      - name: Emit exactly one sanitized RBAC envelope
        if: always()
        env:
          OPERATION: ${{ inputs.operation }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          APPROVAL_ID: ${{ inputs.approval_id }}
          INPUT_OUTCOME: ${{ steps.inputs.outcome }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          INTEGRITY_OUTCOME: ${{ steps.integrity.outcome }}
          OIDC_OUTCOME: ${{ steps.oidc.outcome }}
          IDENTITY_OUTCOME: ${{ steps.identity.outcome }}
          OPERATION_OUTCOME: ${{ steps.operation.outcome }}
        run: |
          python3 - <<'PY'
          import json, os, re
          stage, classification, exit_code = 'complete', 'complete', 0
          ordered = [
              ('input_validation', 'INPUT_OUTCOME'), ('checkout_integrity', 'CHECKOUT_OUTCOME'),
              ('checkout_integrity', 'INTEGRITY_OUTCOME'), ('oidc_authentication', 'OIDC_OUTCOME'),
              ('arm_token_claim_validation', 'IDENTITY_OUTCOME'), ('rbac_operation', 'OPERATION_OUTCOME')]
          for candidate_stage, outcome in ordered:
              if os.environ.get(outcome) != 'success':
                  stage, classification, exit_code = candidate_stage, f'{candidate_stage}_failed', 1
                  break
          if stage == 'rbac_operation':
              try:
                  state = dict(line.split('=', 1) for line in open(os.environ['RBAC_STATE_FILE'], encoding='utf-8').read().splitlines() if '=' in line)
                  allowed_stages = {'artifact_validation', 'deployment_validation', 'what_if', 'deployment', 'deployment_readback', 'assignment_removal', 'residue_verification'}
                  allowed_classifications = {'operation_failed', 'deployment_failed', 'cleanup_failed', 'azure_authorization_failed', 'azure_template_validation_failed', 'azure_error_unclassified', 'oversized_evidence', 'malformed_evidence', 'malformed_what_if', 'unexpected_rbac_resource', 'unexpected_rbac_operation', 'missing_rbac_resource', 'broad_role_substitution'}
                  if state.get('stage') in allowed_stages: stage = state['stage']
                  if state.get('classification') in allowed_classifications: classification = state['classification']
                  candidate_code = state.get('azure_error_code', '')
                  allowed_error_codes = {'AuthorizationFailed', 'InvalidTemplate', 'InvalidTemplateDeployment'}
                  azure_error_code = candidate_code if candidate_code in allowed_error_codes else None
                  expected_codes = {
                      'azure_authorization_failed': {'AuthorizationFailed'},
                      'azure_template_validation_failed': {'InvalidTemplate', 'InvalidTemplateDeployment'},
                  }
                  if classification in expected_codes and azure_error_code not in expected_codes[classification]:
                      classification, azure_error_code = 'malformed_evidence', None
                  if classification not in expected_codes:
                      azure_error_code = None
              except Exception:
                  stage, classification, azure_error_code = 'rbac_operation', 'malformed_evidence', None
          else:
              azure_error_code = None
          envelope = {'eventName':'migration-foundation-rbac-boundary','operation':os.environ.get('OPERATION'),'approvalId':os.environ.get('APPROVAL_ID'),'releaseSha':os.environ.get('RELEASE_SHA'),'stage':stage,'classification':classification,'azureErrorCode':azure_error_code,'exitCode':exit_code}
          if not re.fullmatch(r'[0-9a-f]{40}', envelope['releaseSha'] or ''): envelope['releaseSha'] = '<invalid>'
          if not re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9._-]{7,127}', envelope['approvalId'] or ''): envelope['approvalId'] = '<invalid>'
          print(json.dumps(envelope, separators=(',', ':')))
          raise SystemExit(exit_code)
          PY

      - name: Remove temporary RBAC evidence
        if: always()
        run: rm -f "${RBAC_STATE_FILE:-}" "${RBAC_EVIDENCE_FILE:-}"
