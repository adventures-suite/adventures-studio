name: Validate SQL Migrations

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact protected-main commit to package
        required: true
        type: string

  push:
    branches:
      - main

  pull_request:
    paths:
      - database/**
      - infrastructure/private-sql-admin-operation/baseline.sql
      - src/AdventuresSuite.DatabaseMigrator/**
      - src/AdventuresSuite.Authorization.SqlServer/**
      - src/AdventuresSuite.Identity.SqlServer/**
      - src/AdventuresSuite.Planning.SqlServer/**
      - tests/AdventuresSuite.DatabaseIntegrationTests/**
      - .github/workflows/validate-sql-migrations.yml
      - .github/scripts/migration-package-evidence.mjs
      - .github/scripts/migration-package-evidence.test.mjs

permissions:
  contents: read

jobs:
  validate-sql-migrations:
    name: SQL Server migration gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: ${{ secrets.SQL_TEST_SA_PASSWORD }}
        ports:
          - 1433:1433

    env:
      DOTNET_VERSION: "10.0.303"
      RESULTS_DIR: artifacts/sql-migration-results
      MIGRATOR_PUBLISH_DIR: artifacts/database-migrator
      MIGRATOR_PACKAGE_DIR: artifacts/database-migrator-package

    steps:
      - name: Require SQL test secret
        env:
          SQL_TEST_SA_PASSWORD: ${{ secrets.SQL_TEST_SA_PASSWORD }}
        run: |
          if [ -z "$SQL_TEST_SA_PASSWORD" ]; then
            echo "::error::Set the SQL_TEST_SA_PASSWORD repository secret."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Bind package source to workflow commit
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          [[ "$EVENT_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EVENT_SOURCE_SHA"
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            test "$GITHUB_REF" = refs/heads/main
            test "$REQUESTED_SOURCE_SHA" = "$EVENT_SOURCE_SHA"
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Wait for SQL Server
        run: |
          container_id="$(docker ps --filter ancestor=mcr.microsoft.com/mssql/server:2022-latest --format '{{.ID}}' | head -n 1)"
          if [ -z "$container_id" ]; then
            echo "::error::SQL Server service container was not found."
            exit 1
          fi

          for attempt in {1..30}; do
            if docker exec "$container_id" /bin/bash -c \
              '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b -o /dev/null'; then
              echo "SQL Server is ready."
              exit 0
            fi

            echo "SQL Server readiness attempt $attempt of 30 failed; retrying in 2 seconds."
            sleep 2
          done

          echo "::error::SQL Server did not become ready within 60 seconds."
          exit 1

      - name: Restore
        run: |
          dotnet restore TheSimontonAdventures.slnx --locked-mode
          dotnet restore tests/AdventuresSuite.DatabaseIntegrationTests/AdventuresSuite.DatabaseIntegrationTests.csproj --locked-mode
          dotnet restore src/AdventuresSuite.DatabaseMigrator/AdventuresSuite.DatabaseMigrator.csproj \
            --runtime linux-x64 --locked-mode \
            --use-lock-file --lock-file-path packages.linux-x64.lock.json

      - name: Validate package evidence policy
        run: node --test .github/scripts/migration-package-evidence.test.mjs

      - name: Build
        run: |
          dotnet build TheSimontonAdventures.slnx --configuration Release --no-restore
          dotnet build tests/AdventuresSuite.DatabaseIntegrationTests/AdventuresSuite.DatabaseIntegrationTests.csproj \
            --configuration Release \
            --no-restore

      - name: Run SQL migration integration gate
        env:
          SQL_TEST_SA_PASSWORD: ${{ secrets.SQL_TEST_SA_PASSWORD }}
        run: |
          sql_test_connection="Server=localhost,1433;Database=master;User ID=sa;Password=${SQL_TEST_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True;Connect Timeout=5"
          echo "::add-mask::$sql_test_connection"
          export ADVENTURESSUITE_SQL_TEST_CONNECTION_STRING="$sql_test_connection"
          mkdir -p "$RESULTS_DIR"
          dotnet test tests/AdventuresSuite.DatabaseIntegrationTests/AdventuresSuite.DatabaseIntegrationTests.csproj \
            --configuration Release \
            --no-build \
            --no-restore \
            --logger "trx;LogFileName=sql-migration-gate.trx" \
            --results-directory "$RESULTS_DIR"

      - name: Publish migrator artifact
        id: package
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          dotnet publish src/AdventuresSuite.DatabaseMigrator/AdventuresSuite.DatabaseMigrator.csproj \
            --configuration Release \
            --runtime linux-x64 \
            --self-contained true \
            --no-restore \
            --output "$MIGRATOR_PUBLISH_DIR"

          test -x "$MIGRATOR_PUBLISH_DIR/AdventuresSuite.DatabaseMigrator"
          cp src/AdventuresSuite.DatabaseMigrator/run-reviewed-migration-operation.sh \
            "$MIGRATOR_PUBLISH_DIR/run-reviewed-migration-operation.sh"
          chmod 0755 "$MIGRATOR_PUBLISH_DIR/run-reviewed-migration-operation.sh"

          "$MIGRATOR_PUBLISH_DIR/AdventuresSuite.DatabaseMigrator" --list \
            | sed 's/.*Database.Migrations.//' \
            > "$RESULTS_DIR/published-migrations.txt"

          cat > "$RESULTS_DIR/expected-migrations.txt" <<'EOF'
          0001_create_planning_schema.sql
          0002_create_adventure_plans.sql
          0003_create_planning_children.sql
          0004_create_authentication_persistence.sql
          0005_bind_sessions_to_external_identities.sql
          0006_create_creator_memberships.sql
          0007_create_traveler_participations.sql
          0008_create_companion_read_role.sql
          0009_create_adventure_plan_create_results.sql
          0010_create_companion_policy_assignments.sql
          EOF

          diff -u \
            "$RESULTS_DIR/expected-migrations.txt" \
            "$RESULTS_DIR/published-migrations.txt"

          mkdir -p "$MIGRATOR_PACKAGE_DIR"
          artifact_name="adventures-suite-database-migrator-${SOURCE_SHA}"
          package="$MIGRATOR_PACKAGE_DIR/${artifact_name}.tar.gz"
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -C "$MIGRATOR_PUBLISH_DIR" -czf "$package" .
          sha256sum "$package" | sed "s#  .*#  $(basename "$package")#" > "$package.sha256"
          sdk_version="$(dotnet --version)"
          test "$sdk_version" = "$DOTNET_VERSION"
          node .github/scripts/migration-package-evidence.mjs \
            --source-sha "$SOURCE_SHA" \
            --build-run-id "$GITHUB_RUN_ID" \
            --sdk-version "$sdk_version" \
            --package "$package" \
            --catalog "$RESULTS_DIR/published-migrations.txt" \
            --artifact-name "$artifact_name" \
            --lock src/AdventuresSuite.DatabaseMigrator/packages.linux-x64.lock.json \
            --lock src/AdventuresSuite.Companion.SqlServer/packages.linux-x64.lock.json \
            --lock src/AdventuresSuite.Companion.Application/packages.linux-x64.lock.json \
            --lock src/AdventuresSuite.Companion.Contracts/packages.linux-x64.lock.json \
            --lock src/AdventuresSuite.Authorization/packages.linux-x64.lock.json \
            --lock src/AdventuresSuite.Identity/packages.linux-x64.lock.json \
            --output "$MIGRATOR_PACKAGE_DIR/${artifact_name}.evidence.json"
          echo "package=$package" >> "$GITHUB_OUTPUT"

      - name: Capture SQL Server diagnostics
        if: always()
        run: |
          mkdir -p "$RESULTS_DIR"
          container_id="$(docker ps -a --filter ancestor=mcr.microsoft.com/mssql/server:2022-latest --format '{{.ID}}' | head -n 1)"
          if [ -n "$container_id" ]; then
            docker logs "$container_id" > "$RESULTS_DIR/sql-server.log" 2>&1 || true
          fi

      - name: Upload migration evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sql-migration-evidence-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ env.RESULTS_DIR }}
            ${{ env.MIGRATOR_PACKAGE_DIR }}
          if-no-files-found: error
          retention-days: 14

  attest-protected-main-package:
    name: Attest protected-main migration package
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: validate-sql-migrations
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download exact migration evidence artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sql-migration-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: evidence

      - name: Verify exact package checksum before attestation
        id: package
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          mapfile -t packages < <(find evidence -type f -name "adventures-suite-database-migrator-${SOURCE_SHA}.tar.gz")
          test "${#packages[@]}" -eq 1
          package="${packages[0]}"
          checksum_file="${package}.sha256"
          test -f "$checksum_file"
          (cd "$(dirname "$package")" && sha256sum --check "$(basename "$checksum_file")")
          echo "package=$package" >> "$GITHUB_OUTPUT"

      - name: Attest exact protected-main package
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: ${{ steps.package.outputs.package }}
